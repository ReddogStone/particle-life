<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Particle Life</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: ui-monospace, Menlo, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #progress {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
      z-index: 20;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    #fps {
      position: fixed;
      top: 8px;
      left: 8px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.5);
      color: #9f9;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      z-index: 10;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 15;
    }

    #controls button {
      font: 600 14px ui-monospace, Menlo, monospace;
      color: #eef;
      background: rgba(20, 24, 40, 0.85);
      border: 1px solid #46506e;
      border-radius: 8px;
      padding: 11px 20px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }

    #controls button:hover {
      background: rgba(40, 48, 78, 0.95);
      border-color: #6a78a8;
    }

    #controls button:active {
      transform: translateY(1px);
    }

    #btn-record {
      color: #ffdde9;
      border-color: #a23a5e;
    }

    #btn-record:hover {
      background: rgba(80, 24, 44, 0.9);
      border-color: #ff4f86;
    }

    #help {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.55);
      color: #cde;
      font-size: 13px;
      line-height: 1.7;
      z-index: 10;
      border-radius: 6px;
      max-width: 320px;
      transition: opacity 0.4s;
    }

    #help b {
      color: #fff;
    }

    #help kbd {
      display: inline-block;
      min-width: 1.1em;
      text-align: center;
      padding: 1px 6px;
      margin-right: 4px;
      background: #223;
      border: 1px solid #445;
      border-radius: 4px;
      color: #fff;
      font-weight: 600;
    }

    #help .note {
      margin-top: 8px;
      color: #89a;
      font-size: 11px;
    }

    #help.hidden {
      opacity: 0;
    }

    #worldcode {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 15;
      padding: 6px 10px;
      background: rgba(20, 24, 40, 0.85);
      border: 1px solid #46506e;
      border-radius: 8px;
      font: 600 13px ui-monospace, Menlo, monospace;
      color: #cde;
    }

    #worldcode .wc-label {
      color: #89a;
      letter-spacing: 1px;
    }

    #wc-input {
      width: 116px;
      padding: 5px 7px;
      text-align: center;
      background: #0d1018;
      border: 1px solid #2a3450;
      border-radius: 5px;
      color: #fff;
      font: 600 13px ui-monospace, Menlo, monospace;
    }

    #wc-load,
    #wc-copy {
      padding: 5px 11px;
      background: rgba(40, 48, 78, 0.9);
      border: 1px solid #46506e;
      border-radius: 5px;
      color: #eef;
      font: 600 12px ui-monospace, Menlo, monospace;
      cursor: pointer;
    }

    #wc-load:hover,
    #wc-copy:hover {
      border-color: #6a78a8;
    }

    /* Narrow screens (phones): declutter the top so the World Code bar fits. */
    @media (max-width: 640px) {
      #fps {
        display: none;
      }

      #worldcode {
        top: 8px;
        gap: 6px;
        padding: 5px 8px;
        font-size: 11px;
      }

      #worldcode .wc-label {
        letter-spacing: 0;
      }

      #wc-input {
        width: 78px;
        padding: 5px 4px;
        font-size: 12px;
      }

      #wc-load,
      #wc-copy {
        padding: 5px 8px;
        font-size: 11px;
      }

      #help {
        top: 52px;
        left: 8px;
        right: 8px;
        max-width: none;
      }
    }

  <script>
    // Fade the help overlay out after a few seconds; reveal on mouse move.
    (() => {
      const help = document.getElementById("help");
      let timer;
      const arm = () => {
        help.classList.remove("hidden");
        clearTimeout(timer);
        timer = setTimeout(() => help.classList.add("hidden"), 6000);
      };
      window.addEventListener("mousemove", arm);
      arm();
    })();
  </script>

  <script>
    // Background music. Browsers block autoplay until the first user gesture,
    // so we attempt playback on the first interaction anywhere on the page.
    // The tracks play in a shuffled sequence and loop as a set, so a visitor
    // who lingers hears all of them rather than one on repeat.
    (() => {
      const TRACKS = ["swoosh-garden-a.mp3", "swoosh-garden-b.mp3"];
      // Fisher–Yates shuffle so the starting track and order vary per load.
      for (let i = TRACKS.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [TRACKS[i], TRACKS[j]] = [TRACKS[j], TRACKS[i]];
      }
      const bgm = document.getElementById("bgm");
      const btn = document.getElementById("btn-mute");
      let track = 0;
      bgm.src = TRACKS[track];
      bgm.volume = 0.4;

      // When a track finishes, advance to the next; wrap around forever.
      bgm.addEventListener("ended", () => {
        track = (track + 1) % TRACKS.length;
        bgm.src = TRACKS[track];
        bgm.play().catch(() => {});
      });

      let wantSound = true;
      const sync = () => {
        if (wantSound) bgm.play().catch(() => {}); // may be blocked until a gesture
        else bgm.pause();
        btn.textContent = wantSound ? "🔊 Mute" : "🔇 Unmute";
        btn.setAttribute("aria-label", wantSound ? "Mute music" : "Unmute music");
      };

      // First gesture unblocks audio; retry play on early interactions.
      const kick = () => { if (wantSound) bgm.play().catch(() => {}); };
      ["pointerdown", "keydown", "touchstart"].forEach((ev) =>
        window.addEventListener(ev, kick));

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        wantSound = !wantSound;
        sync();
      });

      sync();
    })();
  </script>

        if (done) return;
        done = true;
        cleanup();
        const f = e.target.files && e.target.files[0];
        e.target.value = "";
        if (f) {
          try {
            await liveAudio.loadMusic(f);
          } catch (err) {
            alert(err.message);
          }
        }
        resolve();
      };
      const onCancel = () => {
        if (done) return;
        done = true;
        cleanup();
        console.log("[music] picker cancelled \u2014 rendering without music");
        resolve();
      };
      musicInput.addEventListener("change", onChange);
      musicInput.addEventListener("cancel", onCancel);
      musicInput.click();
    });
  }
  function showProgress(text) {
    progressEl.textContent = text;
    progressEl.style.display = "flex";
  }
  function hideProgress() {
    progressEl.style.display = "none";
  }
  window.addEventListener("keydown", (e) => {
    if (offlineMode) return;
    if (e.target.tagName === "INPUT") return;
    liveAudio.resume();
    if (e.key === "r" || e.key === "R") newRun();
    else if (e.key === "s" || e.key === "S") saveSeed();
    else if (e.key === "l" || e.key === "L") jsonInput.click();
    else if (e.key === "m" || e.key === "M") pickMusicFile();
  });
  function loadWorldCode() {
    if (offlineMode) return;
    liveAudio.resume();
    const code = parseInt(document.getElementById("wc-input").value, 10);
    if (Number.isFinite(code) && code > 0) newRun(code >>> 0);
  }
  document.getElementById("wc-load")?.addEventListener("click", loadWorldCode);
  document.getElementById("wc-input")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loadWorldCode();
  });
  var wcCopyBtn = document.getElementById("wc-copy");
  wcCopyBtn?.addEventListener("click", () => {
    navigator.clipboard?.writeText(document.getElementById("wc-input").value).catch(() => {
    });
    wcCopyBtn.textContent = "COPIED";
    setTimeout(() => wcCopyBtn.textContent = "COPY", 1e3);
  });
  async function runOffline(runJson, { dpr, filename } = {}) {
    offlineMode = true;
    try {
      const music = liveAudio.loadedMusic();
      const blob = await renderOfflineToBlob({
        json: runJson,
        canvas,
        createSim,
        music: music ? { buffer: music.buffer } : null,
        fps: FPS,
        playbackSpeed: runJson.playbackSpeed,
        dpr,
        onProgress: showProgress
      });
      downloadBlob(blob, filename ?? `particle-life-seed-${runJson.seed}.mp4`);
    } catch (err) {
      console.error(err);
      alert("Render failed: " + err.message);
    } finally {
      hideProgress();
      canvas.style.width = "";
      canvas.style.height = "";
      offlineMode = false;
      resizeToWindow();
      resetFrameTiming();
      requestAnimationFrame(frame);
    }
  }
  function recordCurrentRun() {
    if (offlineMode || simTime <= 0) return;
    runOffline(
      {
        version: 1,
        seed: currentSeed,
        duration: simTime,
        width: RECORD_SIZE,
        height: RECORD_SIZE,
        music: liveAudio.loadedMusic()?.name ?? null
      },
      {
        dpr: 1,
        filename: `particle-life-seed-${currentSeed}-t${Math.round(simTime)}.mp4`
      }
    );
  }
  attachJsonInput(jsonInput, async (json) => {
    const loaded = liveAudio.loadedMusic();
    if (json.music && (loaded?.name ?? "") !== json.music) {
      console.log(
        `[music] JSON expects "${json.music}", currently ${loaded ? `"${loaded.name}"` : "none"} \u2014 opening picker`
      );
      await pickMusicFile();
    }
    await runOffline(json, { filename: `orbital-swarm-seed-${json.seed}.mp4` });
  });
  document.getElementById("btn-new")?.addEventListener("click", () => {
    if (offlineMode) return;
    liveAudio.resume();
    newRun();
  });
  document.getElementById("btn-record")?.addEventListener("click", () => {
    if (offlineMode) return;
    liveAudio.resume();
    recordCurrentRun();
  });
  resizeToWindow();
  (async () => {
    if (document.fonts && document.fonts.load) {
      try {
        await Promise.all([
          document.fonts.load("700 32px Orbitron"),
          document.fonts.load("900 84px Orbitron"),
          document.fonts.load("400 24px Lora"),
          document.fonts.load("italic 600 48px Lora")
        ]);
      } catch (_) {
      }
    }
    newRun();
    requestAnimationFrame(frame);
  })();
})();

  </script>
</body>
